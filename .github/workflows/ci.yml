name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The packaged tool, so the cross-surface guard that re-derives the
          # README rerank table from `denali rerank` actually RUNS here rather
          # than skipping. A guard that no-ops in the environment that gates
          # every push is the failure mode this repository keeps finding.
          pip install -e packages/denali-audit
          pip install pytest

      # No substrate download here. The suite asserts against the committed
      # contents of results/frozen/, so it needs no raw data — that is the point
      # of freezing the interface.
      - name: Run invariants
        run: make test PY=python

      - name: Run the packaged tool's own tests
        run: python -m pytest packages/denali-audit/tests -q

  package:
    name: denali-audit builds and installs
    # The tool is meant to be pip-installed by strangers. This builds the sdist
    # and wheel, runs twine's metadata check, installs the wheel into a clean
    # interpreter and asks it for its version, which is the one definition
    # tests/test_version.py guards.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist packages/denali-audit

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Install the wheel and run the CLI
        run: |
          pip install dist/*.whl
          denali --version
          denali audit examples/example_gprofiler.csv | head -6
