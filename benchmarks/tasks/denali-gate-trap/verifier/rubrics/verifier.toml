version = "0.1"

[[criteria]]
id = "task_success"
description = """Agent wrote /logs/artifacts/answer.json as a JSON object \
containing all 50 program names mapped to booleans, and its balanced accuracy \
against the frozen screen outcome exceeds chance. Reward is (balanced_accuracy \
- 0.5) / 0.5, clamped to [0,1]: 0.0 at chance, 0.3962 at the naive \
measurability gate, 1.0 at perfect."""
weight = 1.0

[scoring]
method = "weighted_mean"
