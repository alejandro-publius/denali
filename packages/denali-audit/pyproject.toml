[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denali-audit"
version = "0.1.0"
description = "How much of your gene-set ranking is set size rather than biology?"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/alejandro-publius/denali"
Results = "https://alejandro-publius.github.io/denali/"

[project.scripts]
denali = "denali_audit.cli:main"

[tool.setuptools.packages.find]
include = ["denali_audit*"]
