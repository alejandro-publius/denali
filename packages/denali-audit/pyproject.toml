[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denali-audit"
version = "0.1.0"
description = "How much of your gene-set ranking is set size rather than biology?"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
# scipy is NOT optional: core.py uses pandas' spearman correlation, which
# dispatches into scipy. Declaring only numpy and pandas produced a package
# that installed cleanly and then raised ModuleNotFoundError on the first
# audit -- found by building an environment at the declared floors instead of
# assuming they worked.
#
# Floors are what actually installs AND passes the tests on the supported
# interpreters, not the oldest version that ever worked. numpy 1.24 cannot
# build on Python 3.12 at all (it predates 3.12 and needs distutils) and
# pandas 2.0.3 fails the same way, so the previous >=1.24 / >=1.5 advertised
# support that does not exist.
#
# These floors are TESTED, not guessed: numpy 1.26.0 + pandas 2.1.1 +
# scipy 1.11.4 on Python 3.12 runs the full suite green (12 passed, 1
# skipped), three major versions below what the study itself pins. The study
# is pinned exactly because numpy 2.x and pandas 3.x changed defaults that
# move results; the tool is loose because it has to install next to whatever
# a stranger already has.
dependencies = ["numpy>=1.26", "pandas>=2.1.1", "scipy>=1.11"]

[project.urls]
Homepage = "https://github.com/alejandro-publius/denali"
Results = "https://alejandro-publius.github.io/denali/"

[project.scripts]
denali = "denali_audit.cli:main"

[tool.setuptools.packages.find]
include = ["denali_audit*"]
