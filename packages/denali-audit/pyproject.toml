[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denali-audit"
# ONE DEFINITION. The version used to be typed here AND in denali_audit/__init__.py
# with nothing checking they agreed, so a release could ship a wheel whose metadata
# and whose `denali --version` disagreed and no suite would notice.
# tests/test_version.py asserts the built metadata matches the module attribute.
dynamic = ["version"]
description = "How much of your gene-set ranking is set size rather than biology?"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
# Two sessions found the same bug from opposite ends on the same day and the
# merge keeps both halves.
#
# THE BUG. core.py used pandas' spearman correlation, which dispatches into
# scipy. scipy was not declared, so a clean install produced ModuleNotFoundError
# on the first audit while every dev machine passed -- they all had scipy from
# the study's own requirements. Declaring scipy fixes it; so does not needing
# it. core.py now computes Spearman from its definition (Pearson on average
# ranks), verified against scipy.stats.spearmanr to 5.6e-17 over 500 tie-heavy
# trials and exactly on the frozen study data. scipy is therefore NOT a
# dependency: it is a large install for one rank correlation, in a tool whose
# whole argument is that running it should be trivial.
#
# THE FLOORS. numpy>=1.24 alongside requires-python >=3.9 advertised support
# that does not exist -- numpy 1.24 predates Python 3.12 and cannot build on it
# (needs distutils, removed in 3.12); pandas 2.0.3 fails the same way. These
# floors are tested, not guessed: numpy 1.26.0 + pandas 2.1.1 on Python 3.12
# runs the full suite green with scipy ABSENT from the environment.
dependencies = ["numpy>=1.26", "pandas>=2.1.1"]
keywords = ["CRISPR", "gene-set", "enrichment", "confounding", "reproducibility",
            "MAGeCK", "BAGEL", "drugZ", "pathway-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/alejandro-publius/denali"
Results = "https://alejandro-publius.github.io/denali/"

[project.scripts]
denali = "denali_audit.cli:main"

[tool.setuptools.packages.find]
include = ["denali_audit*"]

[tool.setuptools.dynamic]
version = {attr = "denali_audit.__version__"}
